<script data-reverse-linked-list-app>
(function (root) {
  'use strict';
  function parseInput(value) {
    if (typeof value !== 'string' || !value.trim()) return { values:null, err:'请输入至少一个整数' };
    var text = value.trim();
    if (!/^-?\d+(?:(?:\s*,\s*|\s+)-?\d+)*$/.test(text)) {
      return { values:null, err:'格式无效，请只输入由空格或单个逗号分隔的整数' };
    }
    var parts = text.match(/-?\d+/g) || [];
    if (parts.length > 10) return { values:null, err:'链表长度请不超过 10' };
    var values = [];
    for (var i = 0; i < parts.length; i++) {
      var number = Number(parts[i]);
      if (!Number.isSafeInteger(number) || number < -999 || number > 999) {
        return { values:null, err:'节点值须在 -999～999：' + parts[i] };
      }
      values.push(number);
    }
    return { values:values, err:null };
  }

  function reverseValues(values) {
    var result = [];
    for (var i = values.length - 1; i >= 0; i--) result.push(values[i]);
    return result;
  }

  function buildSteps(values) {
    var n = values.length, nextOf = [], steps = [];
    for (var i = 0; i < n; i++) nextOf.push(i + 1 < n ? i + 1 : null);
    var prev = null, curr = 0, next = null, nextReady = false, round = 0;
    function label(index) { return index === null ? 'null' : 'N' + (index + 1) + '(' + values[index] + ')'; }
    function snap(phase, message) {
      steps.push({
        phase:phase, round:round, values:values.slice(), nextOf:nextOf.slice(),
        prev:prev, curr:curr, next:next, nextReady:nextReady, msg:message
      });
    }
    snap('start', '初始化：<b>prev = null</b>，<b>curr = head = ' + label(curr) + '</b>。所有节点仍按原方向指向右侧。');
    while (curr !== null) {
      round++;
      next = nextOf[curr];
      nextReady = true;
      snap('save', '第 ' + round + ' 轮 · <span class="save">先保存后继</span>：next = curr.next = <b>' + label(next) + '</b>。即使下一步改写 curr.next，右侧剩余链表也不会丢失。');

      var oldNext = nextOf[curr];
      nextOf[curr] = prev;
      snap('rewire', '第 ' + round + ' 轮 · <span class="rewire">反转当前箭头</span>：curr.next 从 <b>' + label(oldNext) + '</b> 改为 <b>' + label(prev) + '</b>。当前节点加入左侧已反转部分。');

      prev = curr;
      curr = next;
      snap('advance', '第 ' + round + ' 轮 · <span class="advance">双指针整体前进</span>：prev = ' + label(prev) + '，curr = ' + label(curr) + '。' + (curr === null ? '原链表已扫描完毕。' : '进入下一轮。'));
    }
    snap('done', '完成：<b>curr = null</b>，循环结束；<b>prev = ' + label(prev) + '</b> 是新头。链表已原地反转为 <span class="rewire">[' + reverseValues(values).join(', ') + ']</span>。');
    return steps;
  }

  function buildRecursiveSteps(values) {
    var n = values.length, nextOf = [], steps = [], stack = [], newHead = null;
    for (var i = 0; i < n; i++) nextOf.push(i + 1 < n ? i + 1 : null);
    function label(index) { return index === null ? 'null' : 'N' + (index + 1) + '(' + values[index] + ')'; }
    function copyStack() {
      return stack.map(function (frame) { return { head:frame.head, state:frame.state }; });
    }
    function snap(phase, stage, head, message) {
      steps.push({
        phase:phase, stage:stage, values:values.slice(), nextOf:nextOf.slice(),
        head:head, newHead:newHead, stack:copyStack(), depth:stack.length, msg:message
      });
    }
    if (n === 0) {
      stack.push({ head:null, state:'检查基例' });
      snap('base', 'dive', null, '<span class="dive">基例</span>：head == null，直接返回 <b>null</b>。');
      newHead = null;
      stack[0].state = 'return null';
      snap('return', 'return', null, '<span class="return">返回</span>：空链表的 newHead 始终是 <b>null</b>。');
      stack.pop();
      snap('done', 'return', null, '完成：递归调用栈已清空，返回 <b>null</b>。');
      return steps;
    }

    stack.push({ head:0, state:'进入 reverseList(head)' });
    snap('start', 'dive', 0, '进入 <b>reverseList(' + label(0) + ')</b>，准备沿着 head.next 递归下探。');
    for (var head = 0; head < n - 1; head++) {
      stack[stack.length - 1].state = '等待 reverseList(head.next)';
      snap('dive', 'dive', head, '<span class="dive">递归下探</span>：' + label(head) + ' 需要先得到 <b>reverseList(' + label(head + 1) + ')</b> 的结果，当前栈帧暂停等待。');
      stack.push({ head:head + 1, state:'进入 reverseList(head)' });
      snap('dive', 'dive', head + 1, '调用 <b>reverseList(' + label(head + 1) + ')</b>，调用栈深度增加到 <b>' + stack.length + '</b>。');
    }

    newHead = n - 1;
    stack[stack.length - 1].state = '命中 head.next == null';
    snap('base', 'dive', n - 1, '<span class="dive">命中基例</span>：' + label(n - 1) + '.next == null，原尾节点就是 <b>newHead</b>。');
    stack[stack.length - 1].state = 'return newHead';
    snap('return', 'return', n - 1, '<span class="return">基例返回</span>：返回 newHead = <b>' + label(newHead) + '</b>；之后每一层都会原样返回它。');

    for (head = n - 2; head >= 0; head--) {
      stack.pop();
      stack[stack.length - 1].state = '执行 head.next.next = head';
      var child = nextOf[head];
      nextOf[child] = head;
      snap('rewire', 'unwind', head, '<span class="rewire">回溯改向</span>：令 <b>head.next.next = head</b>，即 ' + label(child) + '.next = ' + label(head) + '。此刻两节点暂时互指成环。');

      stack[stack.length - 1].state = '执行 head.next = null';
      nextOf[head] = null;
      snap('cut', 'unwind', head, '<span class="cut">断开旧边</span>：令 <b>head.next = null</b>。若省略这句，' + label(head) + ' 仍指向 ' + label(child) + '，会与刚建立的反向边组成环，结果不再是合法单链表。');

      stack[stack.length - 1].state = 'return newHead';
      snap('return', 'return', head, '<span class="return">当前层返回</span>：不返回 head，而是继续返回同一个 <b>newHead = ' + label(newHead) + '</b>。');
    }
    stack.pop();
    snap('done', 'return', null, '完成：调用栈已清空；所有层返回同一个 <b>newHead = ' + label(newHead) + '</b>，链表反转为 <span class="rewire">[' + reverseValues(values).join(', ') + ']</span>。');
    return steps;
  }

  root.ReverseLinkedListApp = {
    parseInput:parseInput,
    reverseValues:reverseValues,
    buildSteps:buildSteps,
    buildIterativeSteps:buildSteps,
    buildRecursiveSteps:buildRecursiveSteps
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
(function () {
  'use strict';
  var App = window.ReverseLinkedListApp, $ = function (id) { return document.getElementById(id); };
  var input = $('input'), errEl = $('err'), chainEl = $('chain'), statsEl = $('stats');
  var statusEl = $('status'), progressEl = $('progress'), ruleEl = $('rule');
  var prevBtn = $('prevBtn'), nextBtn = $('nextBtn'), playBtn = $('playBtn');
  var values = [], steps = [], stepIndex = 0, timer = null, mode = 'iterative', activeLanguage = 'py';

  function pointerLabel(index) { return index === null ? 'null' : 'N' + (index + 1) + '(' + values[index] + ')'; }
  function isReversed(index, step) {
    if (step.phase === 'done') return true;
    if (mode === 'recursive') {
      return step.newHead !== null && (index === step.newHead || step.nextOf[index] === index - 1);
    }
    return (step.prev !== null && index <= step.prev) || (step.phase === 'rewire' && step.curr === index);
  }
  function badge(text, cls) {
    var span = document.createElement('span'); span.className = 'badge ' + cls; span.textContent = text; return span;
  }
  function addPointers(element, index, step) {
    var top = document.createElement('span'), bottom = document.createElement('span');
    top.className = 'badge-row top'; bottom.className = 'badge-row bottom';
    if (mode === 'iterative') {
      if (step.prev === index) top.appendChild(badge('prev', 'prev'));
      if (step.curr === index) top.appendChild(badge('curr', 'curr'));
      if (step.nextReady && step.next === index) bottom.appendChild(badge('next', 'next'));
    } else {
      if (step.head === index) top.appendChild(badge('head', 'head'));
      if (step.newHead === index) bottom.appendChild(badge('newHead', 'newhead'));
    }
    element.appendChild(top); element.appendChild(bottom);
  }
  function renderNull(side, step) {
    var node = document.createElement('div'), isLeft = side === 'left';
    node.className = 'null-node';
    node.textContent = 'null';
    var top = document.createElement('span'), bottom = document.createElement('span');
    top.className = 'badge-row top'; bottom.className = 'badge-row bottom';
    if (mode === 'iterative') {
      var prevHere = step.prev === null && (isLeft || step.phase === 'done');
      var currHere = step.curr === null && !isLeft;
      var nextHere = step.nextReady && step.next === null && !isLeft;
      if (prevHere && step.phase === 'done') node.className += ' new-head';
      if (currHere) node.className += ' current';
      if (nextHere) node.className += ' saved';
      if (prevHere) top.appendChild(badge('prev', 'prev'));
      if (currHere) top.appendChild(badge('curr', 'curr'));
      if (nextHere) bottom.appendChild(badge('next', 'next'));
    } else if (!isLeft && step.head === null) {
      node.className += ' current';
      top.appendChild(badge('head', 'head'));
    }
    node.appendChild(top); node.appendChild(bottom);
    return node;
  }
  function makeEdge(leftIndex, step) {
    var edge = document.createElement('div'), leftNext = step.nextOf[leftIndex], rightNext = step.nextOf[leftIndex + 1];
    if (leftNext === leftIndex + 1 && rightNext === leftIndex) { edge.className = 'edge cycle'; edge.textContent = '↔'; }
    else if (leftNext === leftIndex + 1) { edge.className = 'edge right'; edge.textContent = '→'; }
    else if (rightNext === leftIndex) { edge.className = 'edge left'; edge.textContent = '←'; }
    else { edge.className = 'edge broken'; edge.textContent = '⋯×⋯'; }
    if (mode === 'iterative' && step.phase === 'save' && step.curr === leftIndex && step.next === leftIndex + 1) edge.className += ' saved-edge';
    return edge;
  }
  function renderChain(step) {
    chainEl.innerHTML = '';
    chainEl.appendChild(renderNull('left', step));
    var firstEdge = document.createElement('div'); firstEdge.className = 'edge left';
    firstEdge.textContent = isReversed(0, step) && step.nextOf[0] === null ? '←' : '·'; chainEl.appendChild(firstEdge);
    values.forEach(function (value, index) {
      var node = document.createElement('div'), reversed = isReversed(index, step);
      node.className = 'node' + (reversed ? ' reversed' : '');
      if ((mode === 'iterative' && step.curr === index) || (mode === 'recursive' && step.head === index)) node.className += ' current';
      if (mode === 'iterative' && step.nextReady && step.next === index) node.className += ' saved';
      if ((mode === 'iterative' && step.phase === 'done' && step.prev === index) ||
          (mode === 'recursive' && step.newHead === index)) node.className += ' new-head';
      node.textContent = value;
      var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = 'N' + (index + 1); node.appendChild(idx);
      addPointers(node, index, step); chainEl.appendChild(node);
      if (index < values.length - 1) chainEl.appendChild(makeEdge(index, step));
    });
    var lastEdge = document.createElement('div'); lastEdge.className = 'edge right';
    lastEdge.textContent = !isReversed(values.length - 1, step) && step.nextOf[values.length - 1] === null ? '→' : '·'; chainEl.appendChild(lastEdge);
    chainEl.appendChild(renderNull('right', step));
  }
  function renderPhases(step) {
    var key = mode === 'iterative' ? step.phase : step.stage;
    var order = mode === 'iterative' ? ['save','rewire','advance'] : ['dive','unwind','return'];
    var active = order.indexOf(key);
    Array.prototype.forEach.call($('phaseStrip').children, function (phase, index) {
      phase.className = 'phase';
      if (step.phase === 'done' || (active >= 0 && index < active)) phase.className += ' done';
      if (phase.dataset.stage === key) phase.className += ' active';
    });
  }
  function renderDashboard(step) {
    if (mode === 'iterative') {
      $('dashboard').innerHTML =
        '<div class="box prev">prev<b>' + pointerLabel(step.prev) + '</b></div>' +
        '<div class="box curr">curr<b>' + pointerLabel(step.curr) + '</b></div>' +
        '<div class="box next">next<b>' + (step.nextReady ? pointerLabel(step.next) : '未保存') + '</b></div>' +
        '<div class="box">已反转节点<b>' + (step.prev === null ? 0 : step.prev + 1) + '</b></div>';
      $('stackPanel').hidden = true;
      return;
    }
    var headNext = step.head === null ? null : step.nextOf[step.head];
    $('dashboard').innerHTML =
      '<div class="box curr">head<b>' + pointerLabel(step.head) + '</b></div>' +
      '<div class="box next">head.next<b>' + pointerLabel(headNext) + '</b></div>' +
      '<div class="box prev">newHead<b>' + pointerLabel(step.newHead) + '</b></div>' +
      '<div class="box">调用栈深度<b>' + step.depth + '</b></div>';
    $('stackPanel').hidden = false;
    $('stackDepth').textContent = 'depth = ' + step.depth;
    $('stackList').innerHTML = '';
    step.stack.forEach(function (frame, index) {
      var item = document.createElement('div');
      item.className = 'frame' + (index === step.stack.length - 1 ? ' active' : '');
      item.textContent = 'reverseList(' + pointerLabel(frame.head) + ') · ' + frame.state;
      $('stackList').appendChild(item);
    });
    if (!step.stack.length) $('stackList').innerHTML = '<span class="hint">调用栈已清空</span>';
  }
  function render() {
    var step = steps[stepIndex];
    renderChain(step); renderPhases(step);
    renderDashboard(step);
    if (mode === 'iterative') {
      if (step.phase === 'save') ruleEl.innerHTML = '<span class="save">next = curr.next</span>';
      else if (step.phase === 'rewire') ruleEl.innerHTML = '<span class="rewire">curr.next = prev</span>';
      else if (step.phase === 'advance') ruleEl.innerHTML = '<span class="advance">prev = curr; curr = next</span>';
      else if (step.phase === 'done') ruleEl.innerHTML = '<span class="rewire">return prev</span>';
      else ruleEl.textContent = 'prev = null; curr = head';
    } else {
      if (step.phase === 'dive' || step.phase === 'start') ruleEl.innerHTML = '<span class="dive">newHead = reverseList(head.next)</span>';
      else if (step.phase === 'base') ruleEl.innerHTML = '<span class="dive">if head == null or head.next == null: return head</span>';
      else if (step.phase === 'rewire') ruleEl.innerHTML = '<span class="rewire">head.next.next = head</span>';
      else if (step.phase === 'cut') ruleEl.innerHTML = '<span class="cut">head.next = null</span>';
      else ruleEl.innerHTML = '<span class="return">return newHead</span>';
    }
    statusEl.innerHTML = step.msg;
    progressEl.textContent = (mode === 'iterative' ? '轮次 ' + step.round + ' / ' + values.length + ' · ' : '栈深度 ' + step.depth + ' · ') +
      '步骤 ' + (stepIndex + 1) + ' / ' + steps.length;
    prevBtn.disabled = stepIndex === 0; nextBtn.disabled = stepIndex === steps.length - 1;
  }
  function renderStats() {
    statsEl.innerHTML =
      '<div class="stat">原链表<b>[' + values.join(', ') + ']</b></div>' +
      '<div class="stat">反转结果<b>[' + App.reverseValues(values).join(', ') + ']</b></div>' +
      '<div class="stat">节点数<b>' + values.length + '</b></div>' +
      '<div class="stat">时间复杂度<b>O(n)</b></div>' +
      '<div class="stat">额外空间<b>' + (mode === 'iterative' ? 'O(1)' : 'O(n) 调用栈') + '</b></div>' +
      '<div class="stat">修改方式<b>原地修改</b></div>';
  }
  function stopPlay() {
    if (timer) { clearInterval(timer); timer = null; playBtn.textContent = '▶ 自动播放'; }
  }
  function next() { if (stepIndex < steps.length - 1) { stepIndex++; render(); } }
  function prev() { if (stepIndex > 0) { stepIndex--; render(); } }
  function togglePlay() {
    if (timer) { stopPlay(); return; }
    if (stepIndex >= steps.length - 1) { stepIndex = 0; render(); }
    playBtn.textContent = '⏸ 暂停';
    timer = setInterval(function () {
      if (stepIndex >= steps.length - 1) { stopPlay(); return; }
      next();
    }, 850);
  }
  function renderCodeTabs() {
    var tabs = $('codeTabs');
    tabs.innerHTML = '';
    ['py','java'].forEach(function (language) {
      var tab = document.createElement('span');
      tab.className = 'code-tab' + (language === activeLanguage ? ' active' : '');
      tab.dataset.lang = language;
      tab.textContent = (mode === 'iterative' ? '迭代 ' : '递归 ') + (language === 'py' ? 'Python' : 'Java');
      tab.onclick = function () {
        activeLanguage = language;
        renderCodeTabs();
      };
      tabs.appendChild(tab);
    });
    $('codeBlock').innerHTML = codes[mode][activeLanguage];
  }
  function renderMethod() {
    Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (button) {
      var active = button.dataset.mode === mode;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    if (mode === 'iterative') {
      $('pageHeading').textContent = '206. 反转链表 · 迭代法逐帧动画';
      $('pageSub').innerHTML = '用 <code>prev</code> 保存已反转链表的头，<code>curr</code> 扫描原链表。每轮必须先保存后继，再改写当前节点的 <code>next</code>；最终 <code>prev</code> 是新头。';
      $('ideaTitle').textContent = '每一轮固定三个动作';
      $('ideaContent').innerHTML =
        '<div class="idea-item"><div class="no">① 保存后继</div><code>next = curr.next</code>。必须先记住右侧链表入口，否则改箭头后会失去剩余节点。</div>' +
        '<div class="idea-item"><div class="no">② 反转箭头</div><code>curr.next = prev</code>。当前节点从指向右侧改为指向左侧，正式加入已反转部分。</div>' +
        '<div class="idea-item"><div class="no">③ 双指针前进</div><code>prev = curr</code>，<code>curr = next</code>。两个指针整体右移，开始下一轮。</div>';
      $('keyNote').innerHTML = '<b>原地迭代：</b>节点本身不移动，只改变 <code>next</code> 引用。时间复杂度 <code>O(n)</code>，额外空间复杂度 <code>O(1)</code>。';
      $('phaseStrip').innerHTML =
        '<div class="phase" data-stage="save"><div class="no">动作 1</div><b>next = curr.next</b></div>' +
        '<div class="phase" data-stage="rewire"><div class="no">动作 2</div><b>curr.next = prev</b></div>' +
        '<div class="phase" data-stage="advance"><div class="no">动作 3</div><b>prev = curr; curr = next</b></div>';
      $('visualTitle').textContent = '节点位置不动，箭头真实反映当前 next 引用；红色断点表示两部分暂时断开';
      $('legend').innerHTML =
        '<span><span class="dot" style="background:#ecfdf5;border-color:#86efac"></span>已反转部分（箭头向左）</span>' +
        '<span><span class="dot" style="background:#fff;border-color:#cbd5e1"></span>未处理部分（箭头向右）</span>' +
        '<span><span class="dot" style="background:#fef3c7;border-color:#f59e0b"></span>curr 当前节点</span>' +
        '<span><span class="dot" style="background:#e0f2fe;border-color:#0ea5e9"></span>next 已保存</span>' +
        '<span><span class="dot" style="background:#fee2e2;border-color:#ef4444"></span>断开的旧边</span>';
    } else {
      $('pageHeading').textContent = '206. 反转链表 · 递归法逐帧动画';
      $('pageSub').innerHTML = '先用 <code>reverseList(head.next)</code> 下探到原尾节点，再逐层回溯：建立反向边、断开旧正向边，并始终返回同一个 <code>newHead</code>。';
      $('ideaTitle').textContent = '递归的三个阶段';
      $('ideaContent').innerHTML =
        '<div class="idea-item"><div class="no">① dive · 下探</div>当前层暂停，调用 <code>reverseList(head.next)</code>；调用栈逐层加深，直到命中基例。</div>' +
        '<div class="idea-item"><div class="no">② unwind · 回溯</div><code>head.next.next = head</code> 让后一节点指回当前节点，再用 <code>head.next = null</code> 断开旧边。</div>' +
        '<div class="idea-item"><div class="no">③ return · 返回</div>原尾节点是 <code>newHead</code>；每一层都原样返回它，而不是返回当前 <code>head</code>。</div>';
      $('keyNote').innerHTML = '<b><code>head.next = null</code> 不可省：</b>回指后旧的 <code>head → head.next</code> 仍存在，会形成双向环；必须立即断开。时间 <code>O(n)</code>，额外空间 <code>O(n)</code> 调用栈。';
      $('phaseStrip').innerHTML =
        '<div class="phase" data-stage="dive"><div class="no">阶段 1</div><b>dive · 递归下探 / 基例</b></div>' +
        '<div class="phase" data-stage="unwind"><div class="no">阶段 2</div><b>unwind · 回指并断旧边</b></div>' +
        '<div class="phase" data-stage="return"><div class="no">阶段 3</div><b>return · 返回 newHead</b></div>';
      $('visualTitle').textContent = '箭头按真实 next 拓扑绘制；红色 ↔ 是回指后、断旧边前的短暂环';
      $('legend').innerHTML =
        '<span><span class="dot" style="background:#22c55e;border-color:#16a34a"></span>newHead（原尾节点）</span>' +
        '<span><span class="dot" style="background:#fef3c7;border-color:#f59e0b"></span>当前 head</span>' +
        '<span><span class="dot" style="background:#ecfdf5;border-color:#86efac"></span>已建立的反向边</span>' +
        '<span><span class="dot" style="background:#fee2e2;border-color:#ef4444"></span>未断旧边造成的短暂环</span>';
    }
    renderCodeTabs();
  }
  function load() {
    var parsed = App.parseInput(input.value);
    if (!parsed.values) { errEl.textContent = '输入有误：' + parsed.err + '。'; errEl.classList.add('show'); return; }
    errEl.classList.remove('show'); stopPlay(); values = parsed.values;
    steps = mode === 'iterative' ? App.buildIterativeSteps(values) : App.buildRecursiveSteps(values);
    stepIndex = 0; renderStats(); render();
  }
  prevBtn.onclick = function () { stopPlay(); prev(); };
  nextBtn.onclick = function () { stopPlay(); next(); };
  playBtn.onclick = togglePlay;
  $('resetBtn').onclick = function () { stopPlay(); stepIndex = 0; render(); };
  $('loadBtn').onclick = load;
  input.addEventListener('keydown', function (event) { if (event.key === 'Enter') load(); });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
    chip.onclick = function () { input.value = chip.dataset.v; load(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.mode-btn'), function (button) {
    button.onclick = function () {
      if (mode === button.dataset.mode) return;
      stopPlay(); mode = button.dataset.mode; activeLanguage = 'py'; renderMethod(); load();
    };
  });
  document.addEventListener('keydown', function (event) {
    if (document.activeElement === input) return;
    if (event.key === 'ArrowRight') { stopPlay(); next(); }
    if (event.key === 'ArrowLeft') { stopPlay(); prev(); }
  });

  var codes = {
    iterative:{
      py:'<span class="cmt"># 迭代法 · O(n) 时间 · O(1) 额外空间 · 原地修改 next</span>\n' +
      'class Solution:\n' +
      '    def reverseList(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n' +
      '        prev, curr = None, head\n' +
      '\n' +
      '        while curr:\n' +
      '            nxt = curr.next       <span class="cmt"># ① 先保存后继，避免断链</span>\n' +
      '            curr.next = prev      <span class="cmt"># ② 反转当前箭头</span>\n' +
      '            prev, curr = curr, nxt <span class="cmt"># ③ 双指针整体前进</span>\n' +
      '\n' +
      '        return prev               <span class="cmt"># 新的链表头</span>',
      java:'<span class="cmt">// 迭代法 · O(n) 时间 · O(1) 额外空间 · 原地修改 next</span>\n' +
      'class Solution {\n' +
      '    public ListNode reverseList(ListNode head) {\n' +
      '        ListNode prev = null, curr = head;\n' +
      '\n' +
      '        while (curr != null) {\n' +
      '            ListNode next = curr.next; <span class="cmt">// ① 先保存后继</span>\n' +
      '            curr.next = prev;          <span class="cmt">// ② 反转当前箭头</span>\n' +
      '            prev = curr;               <span class="cmt">// ③ 双指针前进</span>\n' +
      '            curr = next;\n' +
      '        }\n' +
      '\n' +
      '        return prev;\n' +
      '    }\n' +
      '}'
    },
    recursive:{
      py:'<span class="cmt"># 递归法 · O(n) 时间 · O(n) 调用栈</span>\n' +
      'class Solution:\n' +
      '    def reverseList(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:\n' +
      '        if head is None or head.next is None:\n' +
      '            return head                 <span class="cmt"># 基例：原尾节点成为 newHead</span>\n' +
      '\n' +
      '        new_head = self.reverseList(head.next) <span class="cmt"># dive：先递归下探</span>\n' +
      '        head.next.next = head           <span class="cmt"># unwind：后一节点指回当前节点</span>\n' +
      '        head.next = None                <span class="cmt"># 断开旧正向边，否则会成环</span>\n' +
      '        return new_head                 <span class="cmt"># 每层返回同一个原尾节点</span>',
      java:'<span class="cmt">// 递归法 · O(n) 时间 · O(n) 调用栈</span>\n' +
      'class Solution {\n' +
      '    public ListNode reverseList(ListNode head) {\n' +
      '        if (head == null || head.next == null) {\n' +
      '            return head;                <span class="cmt">// 基例</span>\n' +
      '        }\n' +
      '\n' +
      '        ListNode newHead = reverseList(head.next); <span class="cmt">// dive</span>\n' +
      '        head.next.next = head;          <span class="cmt">// unwind：建立反向边</span>\n' +
      '        head.next = null;               <span class="cmt">// 断旧边，防止成环</span>\n' +
      '        return newHead;                 <span class="cmt">// 始终返回原尾节点</span>\n' +
      '    }\n' +
      '}'
    }
  };
  renderMethod();
  load();
})();
</script>
</body>
</html>
