<script data-sort-list-logic>
(function (root) {
  'use strict';

  function parseInput(value) {
    if (typeof value !== 'string' || !value.trim()) return { values:null, err:'请输入至少一个整数' };
    var text = value.trim();
    if (!/^-?\d+(?:(?:\s*,\s*|\s+)-?\d+)*$/.test(text)) {
      return { values:null, err:'格式无效，请只输入由空格或单个逗号分隔的整数' };
    }
    var parts = text.match(/-?\d+/g) || [];
    if (parts.length > 10) return { values:null, err:'链表长度请不超过 10' };
    var values = [];
    for (var i = 0; i < parts.length; i++) {
      var number = Number(parts[i]);
      if (!Number.isSafeInteger(number) || number < -999 || number > 999) {
        return { values:null, err:'节点值须在 -999～999：' + parts[i] };
      }
      values.push(number);
    }
    return { values:values, err:null };
  }

  function initialNext(length) {
    var nextOf = [];
    for (var i = 0; i < length; i++) nextOf.push(i + 1 < length ? i + 1 : null);
    return nextOf;
  }

  function traverse(values, nextOf, head) {
    var ids = [], result = [], seen = {}, at = head;
    while (at !== null && !seen[at] && ids.length <= values.length) {
      seen[at] = true; ids.push(at); result.push(values[at]); at = nextOf[at];
    }
    return { ids:ids, values:result, terminated:at === null, cycle:at !== null };
  }

  function stableIds(values) {
    return values.map(function (_, index) { return index; }).sort(function (a, b) {
      return values[a] - values[b] || a - b;
    });
  }

  function buildRecursiveSteps(inputValues) {
    var values = inputValues.slice(), n = values.length, nextOf = initialNext(n), steps = [], stack = [];
    var slow = null, fast = null, left = null, right = null, p1 = null, p2 = null, tail = null;
    var mergedIds = [], focusIds = [], changedFrom = null, changedTo = null, comparisons = 0, writes = 0;
    function label(id) { return id === null ? 'null' : 'N' + (id + 1) + '(' + values[id] + ')'; }
    function collect(head) { return traverse(values, nextOf, head).ids; }
    function copyStack() {
      return stack.map(function (frame) { return { head:frame.head, ids:frame.ids.slice(), state:frame.state, depth:frame.depth }; });
    }
    function snap(stage, action, message, head) {
      steps.push({
        mode:'recursive', stage:stage, action:action, values:values.slice(), nextOf:nextOf.slice(), head:head,
        slow:slow, fast:fast, left:left, right:right, p1:p1, p2:p2, tail:tail,
        mergedIds:mergedIds.slice(), focusIds:focusIds.slice(), stack:copyStack(),
        changedFrom:changedFrom, changedTo:changedTo, comparisons:comparisons, writes:writes, msg:message
      });
      changedFrom = null; changedTo = null;
    }
    function merge(a, b, ownerHead) {
      left = a; right = b; p1 = a; p2 = b; tail = null; mergedIds = [];
      focusIds = collect(a).concat(collect(b));
      snap('merge', 'merge-start', '左右子链均已排序，开始稳定归并 <b>' + label(a) + '</b> 与 <b>' + label(b) + '</b>。', ownerHead);
      var mergedHead = null;
      while (p1 !== null || p2 !== null) {
        var takeLeft;
        if (p1 !== null && p2 !== null) {
          comparisons++;
          takeLeft = values[p1] <= values[p2];
          snap('merge', 'compare', '比较 <b>' + label(p1) + '</b> 与 <b>' + label(p2) + '</b>：' +
            (values[p1] === values[p2] ? '值相等，使用 <code>&lt;=</code> 先取 left，保持稳定。' : '选择较小的 <b>' + label(takeLeft ? p1 : p2) + '</b>。'), ownerHead);
        } else {
          takeLeft = p2 === null;
          snap('merge', 'compare', '一侧已空，继续接入另一侧的 <b>' + label(takeLeft ? p1 : p2) + '</b>。', ownerHead);
        }
        var chosen = takeLeft ? p1 : p2, saved = nextOf[chosen];
        if (takeLeft) p1 = saved; else p2 = saved;
        nextOf[chosen] = null; writes++;
        if (tail === null) mergedHead = chosen;
        else { nextOf[tail] = chosen; changedFrom = tail; changedTo = chosen; writes++; }
        tail = chosen; mergedIds.push(chosen);
        snap('merge', 'attach', '<span class="merge">接入原节点</span>：输出尾部连接 ' + label(chosen) +
          '；只改写 <code>next</code>，节点值与身份都没有交换。', ownerHead);
      }
      p1 = p2 = null;
      snap('return', 'merge-done', '归并完成，得到有序子链 <b>[' + mergedIds.map(function (id) { return values[id]; }).join(', ') + ']</b>，返回头节点 ' + label(mergedHead) + '。', mergedHead);
      return mergedHead;
    }
    function sort(head, depth) {
      var ids = collect(head);
      stack.push({ head:head, ids:ids.slice(), state:'进入 sortList', depth:depth });
      focusIds = ids.slice(); slow = fast = left = right = p1 = p2 = tail = null; mergedIds = [];
      snap('split', 'enter', '进入 <b>sortList(' + label(head) + ')</b>，当前递归区间有 ' + ids.length + ' 个节点。', head);
      if (head === null || nextOf[head] === null) {
        stack[stack.length - 1].state = '基例：长度 ≤ 1';
        snap('subproblem', 'base', '命中基例：单节点链 <b>' + label(head) + '</b> 天然有序，直接返回同一节点。', head);
        stack[stack.length - 1].state = 'return ' + label(head);
        snap('return', 'base-return', '从基例返回 <b>' + label(head) + '</b>；调用栈开始回溯。', head);
        stack.pop();
        return head;
      }
      slow = head; fast = nextOf[head];
      stack[stack.length - 1].state = '快慢指针找中点';
      snap('split', 'scan', '初始化 <b>slow = head</b>，<b>fast = head.next</b>；fast 每次走两步，slow 每次走一步。', head);
      while (fast !== null && nextOf[fast] !== null) {
        slow = nextOf[slow];
        fast = nextOf[nextOf[fast]];
        snap('split', 'scan', '<span class="move">指针前进</span>：slow 到 ' + label(slow) + '，fast 到 ' + label(fast) + '。', head);
      }
      right = nextOf[slow]; left = head;
      snap('split', 'midpoint', '定位中点：<b>slow = ' + label(slow) + '</b> 是左半尾，右半从 <b>' + label(right) + '</b> 开始。', head);
      nextOf[slow] = null; changedFrom = slow; changedTo = null; writes++;
      focusIds = ids.slice();
      snap('split', 'cut', '<span class="split">断链</span>：执行 <b>slow.next = null</b>，原链被真实切成 left 与 right 两个独立子问题。', head);
      var leftHead = left, rightHead = right;
      stack[stack.length - 1].state = '等待左子链';
      snap('subproblem', 'call-left', '递归排序左子链 <b>' + label(leftHead) + '</b>。当前栈帧暂停等待。', leftHead);
      leftHead = sort(leftHead, depth + 1);
      stack[stack.length - 1].state = '等待右子链';
      left = leftHead; right = rightHead; focusIds = collect(rightHead);
      snap('subproblem', 'call-right', '左子链已返回；现在递归排序右子链 <b>' + label(rightHead) + '</b>。', rightHead);
      rightHead = sort(rightHead, depth + 1);
      stack[stack.length - 1].state = '回溯：merge(left, right)';
      var result = merge(leftHead, rightHead, head);
      stack[stack.length - 1].state = 'return ' + label(result);
      focusIds = collect(result);
      snap('return', 'return', '当前层回溯完成：向上一层返回有序链头 <b>' + label(result) + '</b>。', result);
      stack.pop();
      return result;
    }

    slow = fast = left = right = p1 = p2 = tail = null; focusIds = collect(head); mergedIds = focusIds.slice();

        '<div class="idea-item"><div class="no">① 求长度与翻倍</div>先扫描得到 <code>length</code>；外层循环按 <code>size = 1, 2, 4...</code> 扩大有序段。</div>' +
        '<div class="idea-item"><div class="no">② split 两个相邻段</div>从 <code>current</code> 切出 left，再切出 right，同时保存下一组入口 <code>next</code>。</div>' +
        '<div class="idea-item"><div class="no">③ merge 并接回主链</div>逐节点稳定归并，令前缀尾连接本组新头；一轮结束后 <code>size *= 2</code>。</div>';
      $('keyNote').innerHTML = '<b>常数辅助空间：</b>不使用递归，只维护固定数量的指针；所有节点均复用，只修改 <code>next</code>。时间 <code>O(n log n)</code>，额外空间 <code>O(1)</code>。';

  var codes = {
    recursive:{
      py:`<span class="cmt"># 自顶向下 · O(n log n) 时间 · O(log n) 递归栈</span>
class Solution:
    def sortList(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:
        if head is None or head.next is None:
            return head

        slow, fast = head, head.next
        while fast and fast.next:
            slow = slow.next
            fast = fast.next.next

        right = slow.next
        slow.next = None                 <span class="cmt"># 真实断开左右链</span>
        left = self.sortList(head)
        right = self.sortList(right)
        return self.mergeTwoLists(left, right)

    def mergeTwoLists(self, left, right):
        dummy = tail = ListNode()
        while left and right:
            if left.val &lt;= right.val:   <span class="cmt"># 相等先取 left，保持稳定</span>
                tail.next, left = left, left.next
            else:
                tail.next, right = right, right.next
            tail = tail.next
        tail.next = left or right
        return dummy.next`,
      java:`<span class="cmt">// 自顶向下 · O(n log n) 时间 · O(log n) 递归栈</span>
class Solution {
    public ListNode sortList(ListNode head) {
        if (head == null || head.next == null) return head;
        ListNode slow = head, fast = head.next;
        while (fast != null &amp;&amp; fast.next != null) {
            slow = slow.next;
            fast = fast.next.next;
        }
        ListNode right = slow.next;
        slow.next = null;                <span class="cmt">// 断链</span>
        ListNode left = sortList(head);
        right = sortList(right);
        return mergeTwoLists(left, right);
    }

    private ListNode mergeTwoLists(ListNode left, ListNode right) {
        ListNode dummy = new ListNode(), tail = dummy;
        while (left != null &amp;&amp; right != null) {
            if (left.val &lt;= right.val) { <span class="cmt">// 稳定：相等取 left</span>
                tail.next = left;
                left = left.next;
            } else {
                tail.next = right;
                right = right.next;
            }
            tail = tail.next;
        }
        tail.next = (left != null) ? left : right;
        return dummy.next;
    }
}`
    },
    iterative:{
      py:`<span class="cmt"># 自底向上 · O(n log n) 时间 · O(1) 额外空间</span>
class Solution:
    def sortList(self, head: Optional[ListNode]) -&gt; Optional[ListNode]:
        length, node = 0, head
        while node:
            length += 1
            node = node.next

        dummy = ListNode(0, head)
        size = 1
        while size &lt; length:
            tail, current = dummy, dummy.next
            while current:
                left = current
                right = self.split(left, size)
                current = self.split(right, size)
                merged_head, merged_tail = self.merge(left, right)
                tail.next = merged_head
                tail = merged_tail
            size *= 2
        return dummy.next

    def split(self, head, size):
        if head is None:
            return None
        for _ in range(1, size):
            if head.next is None:
                break
            head = head.next
        rest = head.next
        head.next = None
        return rest

    def merge(self, left, right):
        dummy = tail = ListNode()
        while left and right:
            if left.val &lt;= right.val:   <span class="cmt"># 稳定合并</span>
                tail.next, left = left, left.next
            else:
                tail.next, right = right, right.next
            tail = tail.next
        tail.next = left or right
        while tail.next:
            tail = tail.next
        return dummy.next, tail`,
      java:`<span class="cmt">// 自底向上 · O(n log n) 时间 · O(1) 额外空间</span>
class Solution {
    public ListNode sortList(ListNode head) {
        int length = 0;
        for (ListNode p = head; p != null; p = p.next) length++;
        ListNode dummy = new ListNode(0, head);

        for (int size = 1; size &lt; length; size &lt;&lt;= 1) {
            ListNode tail = dummy, current = dummy.next;
            while (current != null) {
                ListNode left = current;
                ListNode right = split(left, size);
                current = split(right, size);
                ListNode[] merged = merge(left, right);
                tail.next = merged[0];
                tail = merged[1];
            }
        }
        return dummy.next;
    }

    private ListNode split(ListNode head, int size) {
        if (head == null) return null;
        for (int i = 1; i &lt; size &amp;&amp; head.next != null; i++) {
            head = head.next;
        }
        ListNode rest = head.next;
        head.next = null;
        return rest;
    }

    private ListNode[] merge(ListNode left, ListNode right) {
        ListNode dummy = new ListNode(), tail = dummy;
        while (left != null &amp;&amp; right != null) {
            if (left.val &lt;= right.val) {
                tail.next = left; left = left.next;
            } else {
                tail.next = right; right = right.next;
            }
            tail = tail.next;
        }
        tail.next = (left != null) ? left : right;
        while (tail.next != null) tail = tail.next;
        return new ListNode[]{dummy.next, tail};
    }
}`
